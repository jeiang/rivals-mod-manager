name: Build Release

on:
  push:
    tags:
      - "*"

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-latest
            archive: rivals-mod-manager-linux-x86_64.tar.gz
            executable: rivals-mod-manager
          - name: windows-x86_64
            os: windows-latest
            archive: rivals-mod-manager-windows-x86_64.zip
            executable: rivals-mod-manager.exe
          - name: macos-x86_64
            os: macos-13
            archive: rivals-mod-manager-macos-x86_64.tar.gz
            executable: rivals-mod-manager

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libxkbcommon-dev pkg-config

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build
        run: cargo build --release --locked

      - name: Package Unix
        if: runner.os != 'Windows'
        run: |
          mkdir -p dist
          cp "target/release/${{ matrix.executable }}" "dist/${{ matrix.executable }}"
          tar -czf "${{ matrix.archive }}" -C dist "${{ matrix.executable }}"

      - name: Package Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist
          Copy-Item "target/release/${{ matrix.executable }}" "dist/${{ matrix.executable }}"
          Compress-Archive -Path "dist/${{ matrix.executable }}" -DestinationPath "${{ matrix.archive }}"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: ${{ matrix.archive }}

  release:
    name: Publish Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
